<head>

</head>
<body>
  <main class="auth-page">
    <!-- พื้นหลังคลื่นเสียงใช้ตกแต่งเหมือนหน้า Landing Page -->

<path d="M-40 280 C145 165 230 150 370 255 S570 390 735 250 970 100 1110 235 1300 360 1480 210"/><path d="M-40 290 C145 175 230 160 370 265 S570 400 735 260 970 110 1110 245 1300 370 1480 220"/><path d="M-40 300 C145 185 230 170 370 275 S570 410 735 270 970 120 1110 255 1300 380 1480 230"/><path d="M-40 310 C145 195 230 180 370 285 S570 420 735 280 970 130 1110 265 1300 390 1480 240"/><path d="M-40 320 C145 205 230 190 370 295 S570 430 735 290 970 140 1110 275 1300 400 1480 250"/><path d="M-40 330 C145 215 230 200 370 305 S570 440 735 300 970 150 1110 285 1300 410 1480 260"/><path d="M-40 340 C145 225 230 210 370 315 S570 450 735 310 970 160 1110 295 1300 420 1480 270"/><path d="M-40 350 C145 235 230 220 370 325 S570 460 735 320 970 170 1110 305 1300 430 1480 280"/><path d="M-40 360 C145 245 230 230 370 335 S570 470 735 330 970 180 1110 315 1300 440 1480 290"/><path d="M-40 370 C145 255 230 240 370 345 S570 480 735 340 970 190 1110 325 1300 450 1480 300"/><path d="M-40 380 C145 265 230 250 370 355 S570 490 735 350 970 200 1110 335 1300 460 1480 310"/><path d="M-40 390 C145 275 230 260 370 365 S570 500 735 360 970 210 1110 345 1300 470 1480 320"/><path d="M-40 400 C145 285 230 270 370 375 S570 510 735 370 970 220 1110 355 1300 480 1480 330"/>
</g></svg></div>
    <section class="auth-card">
      <h1 class="auth-brand">Create an <span>Account</span></h1>
      <p class="auth-subtitle">Sign up to start learning and keep your learning results in one place.</p>

      <!-- แบบฟอร์มสมัครสมาชิก: ชื่อ อีเมล และรหัสผ่าน -->
      <form id="signupForm">
        <div class="form-group">
          <label for="displayName">Your name</label>
          <input id="displayName" name="displayName" type="text" placeholder="Enter your name" autocomplete="name" required maxlength="60">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Enter your password again" autocomplete="new-password" minlength="6" required>
        </div>
        <button class="submit-button" id="signupSubmit" type="submit">Create Account</button>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
      </form>
      <p class="switch-page">Already have an account? <a href="login.html">Log In</a></p>
    </section>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
